# Автопроверка: GitHub запускает её сам при каждом push и при каждом PR в main.
# Если что-то сломалось (не собирается, распаковка не совпала с исходником), проверка станет красной.

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ---------- Ядро: сборка и проверки ----------
  core:
    name: Ядро — сборка и проверки
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Собрать консольную программу
        run: dotnet publish core-cs/Archiver.Cli -c Release -o out

      - name: Сжать → распаковать → сравнить
        run: bash scripts/roundtrip.sh out/archiver

      - name: Испорченные архивы должны отклоняться (selftest)
        run: out/archiver selftest core-cs/Archiver.Core/Codec.cs

  # ---------- Docker: образ сервиса собирается, и сервис в нём проходит проверку API ----------
  # Имена задач не менять: правило защиты main требует проверки именно с этими названиями
  docker:
    name: Docker — сборка образа
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Собрать образ сервиса
        run: docker build -t archiver-service .

      - name: Запустить сервис в контейнере (с тестовым токеном)
        run: docker run -d --name archiver -p 8080:8080 -e ARENA_TOKEN=ci-test-token archiver-service

      - name: Проверка API по сценарию арены
        run: ARENA_TOKEN=ci-test-token bash scripts/service-check.sh http://localhost:8080

      - name: Проверки крайних случаев от QA
        run: ARENA_TOKEN=ci-test-token bash qa/scripts/qa-edge-cases.sh http://localhost:8080

      - name: Журнал сервиса (если проверка упала)
        if: failure()
        run: docker logs archiver
