# Запуск сервиса на сервере одной командой:
#   docker compose up -d --build     собрать образ и запустить в фоне
#   docker compose logs -f           смотреть журнал
#   docker compose down              остановить
#
# Токен арены кладётся в файл .env рядом с этим файлом (пример — .env.example).
# Файл .env в репозиторий не коммитим: он в .gitignore.

services:
  archiver:
    build: .
    image: archiver-service
    ports:
      - "8080:8080"
    environment:
      # Пустое значение — проверка токена отключена
      - ARENA_TOKEN=${ARENA_TOKEN:-}
    # Если сервис упал или сервер перезагрузился — Docker запустит его снова
    restart: unless-stopped
    # На файле 100 МБ ядро занимает до ~1,5 ГБ (модели блоков + входной файл + архив).
    # Лимит не даёт сервису съесть всю память сервера; на сервере нужно не меньше 4 ГБ
    mem_limit: 3g
